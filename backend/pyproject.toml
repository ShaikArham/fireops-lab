[project]
name = "fireops-lab-api"
version = "0.1.0"
description = "Synthetic-data payment operations portfolio API"
requires-python = "==3.12.*"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.162.2",
    "pandas==3.1.1",
    "psycopg[binary]==3.3.8",
    "pydantic==2.14.3",
    "sqlalchemy==2.0.52",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

