name: Format frontend release files

on:
  push:
    paths:
      - ".github/workflows/format-release.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Apply Biome formatting
        run: npx biome format --write src/app/about-builder.tsx src/app/page.tsx src/app/journey-navigation.tsx src/app/workspace/\[section\]/page.tsx src/app/cv/page.tsx src/app/theme-toggle.tsx
        working-directory: frontend
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/app
          if ! git diff --cached --quiet; then
            git commit -m "Format FireOPS release UI with Biome"
            git push origin main
          fi
