name: Publish GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_API_BASE_URL: "https://fireops-lab.onrender.com"
      - name: Verify deployed CV PDF and About links
        working-directory: frontend
        run: |
          test -s out/index.html
          test -s out/Shaik_Arham_Saquib_Updated_Link.pdf
          test -s out/workspace/about/index.html
          grep -q "../../Shaik_Arham_Saquib_Updated_Link.pdf" out/workspace/about/index.html
      - name: Verify film is published and browser-compatible
        working-directory: frontend
        run: |
          test -s out/videos/fireops-introduction.mp4
          test -s out/videos/fireops-captions.vtt
          grep -q "videos/fireops-introduction.mp4" out/index.html
          ffprobe -v error -show_entries stream=codec_type,codec_name -of csv=p=0 out/videos/fireops-introduction.mp4 | tee /tmp/fireops-streams.txt
          grep -q "h264,video" /tmp/fireops-streams.txt
          grep -q "aac,audio" /tmp/fireops-streams.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

