name: Publish GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_REVIEW_MODE: "static"
          NEXT_PUBLIC_REVIEW_ALERT_ENDPOINT: "https://fireops-lab.onrender.com/api/reviewer-activity"
          NEXT_PUBLIC_API_BASE_URL: "https://fireops-lab.onrender.com"
      - name: Publish CV with GitHub Pages project link
        working-directory: frontend
        run: |
          python -m pip install --disable-pip-version-check pymupdf==1.26.5
          python scripts/publish_cv.py
      - name: Verify deployed CV PDF and About links
        working-directory: frontend
        run: |
          test -s out/index.html
          test -s out/Shaik_Arham_Saquib.pdf
          test -s out/workspace/about/index.html
          grep -q "../../Shaik_Arham_Saquib.pdf" out/workspace/about/index.html
      - name: Install ffprobe for media validation
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Verify film is published and browser-compatible
        working-directory: frontend
        run: |
          test -s out/videos/fireops-introduction.mp4
          test -s out/videos/fireops-captions.vtt
          grep -q "videos/fireops-introduction.mp4" out/index.html
          ffprobe -v error -show_entries stream=codec_type,codec_name -of csv=p=0 out/videos/fireops-introduction.mp4 | tee /tmp/fireops-streams.txt
          grep -q "h264,video" /tmp/fireops-streams.txt
          grep -q "aac,audio" /tmp/fireops-streams.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

