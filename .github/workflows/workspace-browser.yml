name: FireOPS workspace browser checks

on:
  push:
    branches:
      - feat/hiring-manager-workspace
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/workspace-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace-browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run workspace browser tests
        run: npx playwright test e2e/workspace-navigation.spec.ts --project=chromium
      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-browser-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
