name: FireOPS workspace browser checks

on:
  push:
    branches:
      - feat/hiring-manager-workspace
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/workspace-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace-browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: fireops
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: fireops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fireops -d fireops_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fireops@127.0.0.1:5432/fireops_test
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run alembic upgrade head
        working-directory: backend
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Install Chromium
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run workspace browser tests
        run: npx playwright test --config=playwright.journey.config.ts
      - name: Upload test artifacts on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-browser-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
