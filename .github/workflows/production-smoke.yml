name: Production smoke check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public website, API proxy, and approved video
        run: |
          set -euo pipefail
          site="https://fireops-lab.vercel.app"
          echo "Waiting for production API service..."
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 20 "https://fireops-demo-api.vercel.app/health" \
              | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "ok"' 2>/dev/null; then
              echo "Production API healthy"
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "::error::Production API health did not return a healthy response"
              exit 1
            fi
            sleep 15
          done
          cors=$(curl --silent --show-error --dump-header /tmp/fireops-cors-headers --output /tmp/fireops-cors-body --write-out '%{http_code}' \
            --request OPTIONS \
            --header 'Origin: https://fireops-lab.vercel.app' \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: x-fireops-demo,content-type' \
            https://fireops-demo-api.vercel.app/api/v1/demo/session)
          echo "CORS status: $cors"
          cat /tmp/fireops-cors-headers
          cat /tmp/fireops-cors-body
          test "$cors" = "200"
          python3 - <<'PY'
          import json
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          base = "https://fireops-demo-api.vercel.app"
          origin = "https://fireops-lab.vercel.app"
          def call(path, method="GET", token=None):
              headers = {"Origin": origin, "X-FireOps-Demo": "1"}
              if token:
                  headers["Authorization"] = "Bearer " + token
              if method == "POST":
                  headers["Content-Type"] = "application/json"
              req = Request(base + path, data=b"{}" if method == "POST" else None,
                            headers=headers, method=method)
              try:
                  with urlopen(req, timeout=90) as response:
                      return json.load(response)
              except HTTPError as error:
                  print("Demo API request failed:", path, error.code, error.read(500).decode("utf-8", "replace"))
                  raise
          session = call("/api/v1/demo/session", "POST")
          token = session.get("access_token")
          assert token, "Missing cross-origin demo access token"
          scenarios = call("/api/v1/demo/scenarios", token=token)
          if not scenarios.get("scenarios") or any(
              not item.get("reconciliation_run_id") for item in scenarios["scenarios"]
          ):
              call("/api/v1/demo/load", "POST", token)
              scenarios = call("/api/v1/demo/scenarios", token=token)
          run_id = next(item["reconciliation_run_id"] for item in scenarios["scenarios"]
                        if item.get("reconciliation_run_id"))
          insights = call("/api/v1/insights/runs/" + run_id, token=token)
          assert "metrics" in insights, "Overview metrics missing"
          print("Production demo session, scenarios, and Overview metrics passed")
          PY
          for route in / /workspace/overview/ /workspace/payments/ /workspace/reconciliation/ /workspace/investigations/ /workspace/monitoring/ /workspace/insights/ /workspace/about/; do
            code=$(curl --silent --location --output /dev/null --write-out '%{http_code}' --max-time 30 "$site$route")
            echo "$route: $code"
            test "$code" = "200"
          done
          curl --fail --silent --show-error --location --max-time 30 \
            --output /tmp/fireops.mp4 "$site/videos/FireOPS_Lab_Speech_Aligned_Review_v2%20(1).mp4"
          test "$(wc -c </tmp/fireops.mp4)" -gt 1000000
          echo "Production routes, API service, and approved MP4 reachable"
