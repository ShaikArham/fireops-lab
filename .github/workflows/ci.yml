name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run test
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          GITHUB_PAGES: "true"
          GITHUB_REPOSITORY: ShaikArham/fireops-lab
      - run: test -s out/index.html
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: fireops
          POSTGRES_PASSWORD: fireops_test
          POSTGRES_DB: fireops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fireops -d fireops_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://fireops:fireops_test@127.0.0.1:5432/fireops_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run alembic upgrade head
        working-directory: backend
      - run: uv run alembic check
        working-directory: backend
      - run: uv run ruff check .
        working-directory: backend
      - run: uv run pytest
        working-directory: backend

